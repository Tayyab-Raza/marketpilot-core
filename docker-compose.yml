services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketpilot
      POSTGRES_PASSWORD: marketpilot
      POSTGRES_DB: marketpilot
    ports:
      - "5432:5432"
    volumes:
      - marketpilot_pg:/var/lib/postgresql/data
volumes:
  marketpilot_pg:
