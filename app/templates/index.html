<!doctype html><html><head><meta charset="utf-8"><title>MarketPilot AI</title>
<style>body{font-family:Arial,sans-serif;max-width:1100px;margin:40px auto;padding:0 16px;background:#111;color:#eee}.card{background:#1c1c1c;padding:18px;border-radius:12px;margin:12px 0}button{padding:10px 16px}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><h1>MarketPilot AI — NIFTY F&O Research</h1><p>Probabilistic research only. No guaranteed price/time forecasts.</p>
<div class="card"><button onclick="run()">Run NIFTY analysis</button><pre id="out">Configure UPSTOX_ACCESS_TOKEN first.</pre></div>
<script>async function run(){let o=document.getElementById('out');o.textContent='Loading...';try{let r=await fetch('/api/v1/research/nifty');let j=await r.json();o.textContent=JSON.stringify(j,null,2)}catch(e){o.textContent=String(e)}}</script></body></html>
