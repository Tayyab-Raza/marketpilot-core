[project]
name = "marketpilot-core"
version = "0.1.0"
description = "Open-source market-data, F&O analytics, risk and research framework for MarketPilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.6",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
